parameters:
    upload_dir: '%kernel.project_dir%/public/uploads/materiels'
    gemini_api_key: '%env(default::GEMINI_API_KEY)%'  # Valeur par défaut vide
    gemini_model: '%env(default:gemini-2.0-flash-exp::GEMINI_MODEL)%'  # Valeur par défaut

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $uploadDir: '%upload_dir%'
            string $geminiApiKey: '%gemini_api_key%'
            string $geminiModel: '%gemini_model%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Controller\AdminMateriels\:
        resource: '../src/Controller/AdminMateriels/'
        tags: ['controller.service_arguments']

    App\Service\GeminiRecommendationService:
        arguments:
            $apiKey: '%gemini_api_key%'
            $model: '%gemini_model%'
        public: true
      
    App\Service\MaintenanceAlertService:
        arguments:
            $httpClient: '@http_client'
            $geminiApiKey: '%gemini_api_key%'