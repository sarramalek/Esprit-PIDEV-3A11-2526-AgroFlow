[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd", "php82Extensions.sodium", "composer"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs"]

[start]
cmd = "php82 -S 0.0.0.0:$PORT -t public/"